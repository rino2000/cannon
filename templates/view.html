<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cannon - 10x10</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      table {
        border-collapse: collapse;
      }
      td {
        border: 1px solid black;
        width: 30px;
        height: 30px;
        text-align: center;
        cursor: pointer;
        font-size: 20px;
      }
      .selected {
        background-color: lightblue;
      }
      #board {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Cannon 👇🏻 White 👆🏿 Black 🏠 White Town 🏡 Black Town</h1>
    <label>Room: <input type="text" id="roomInput" /></label>
    <button id="joinBtn">Join Room</button>
    <p id="info"></p>
    <p id="turn"></p>
    <p id="playerColor"></p>
    <p id="captureCounter"></p>
    <div id="board"></div>

    <script>
      const BOARD_SIZE = 10;
      const COL_LETTERS = ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j"];
      const SOLDATEN_WHITE = "👇🏻";
      const SOLDATEN_BLACK = "👆🏿";
      const TOWN_WHITE = "🏠";
      const TOWN_BLACK = "🏡";

      let socket = io("http://127.0.0.1:8000", { transports: ["polling"] });
      let room = "";
      let field = null;
      let player = null;
      let gameState = 0;
      let selectedPiece = null;
      let captureCounter = 0;
      let turn = 1;

      const boardDiv = document.getElementById("board");
      const infoEl = document.getElementById("info");
      const playerColorEl = document.getElementById("playerColor");
      const captureCounterEl = document.getElementById("captureCounter");
      const turnEl = document.getElementById("turn");
      const joinBtn = document.getElementById("joinBtn");

      infoEl.innerText = "Enter a room name and click Join.";

      document.getElementById("joinBtn").onclick = () => {
        const name = document.getElementById("roomInput").value.trim();
        if (!name) {
          return alert("Enter room name");
        }
        room = name;
        socket.emit("join_room", name);
      };

      function drawField() {
        if (!field) {
          return;
        }

        boardDiv.innerHTML = "";
        const table = document.createElement("table");

        for (let i = 0; i < BOARD_SIZE; i++) {
          const tr = document.createElement("tr");
          const th = document.createElement("td");

          th.textContent = i;
          th.style.fontWeight = "bold";
          th.style.backgroundColor = "#f0f0f0";
          tr.appendChild(th);

          for (let j = 0; j < BOARD_SIZE; j++) {
            const td = document.createElement("td");
            const val = field[i][j];

            let display = "";

            if (val === 1) {
              display = SOLDATEN_WHITE;
            } else if (val === 2) {
              display = SOLDATEN_BLACK;
            } else if (val === 3) {
              display = TOWN_WHITE;
            } else if (val === 4) {
              display = TOWN_BLACK;
            }

            td.textContent = display;

            if (
              selectedPiece &&
              selectedPiece.x === i &&
              selectedPiece.y === j
            ) {
              td.classList.add("selected");
            }

            td.addEventListener(
              "click",
              (function (x, y) {
                return () => handleCellClick(x, y);
              })(i, j),
            );
            tr.appendChild(td);
          }
          table.appendChild(tr);
        }

        const footer = document.createElement("tr");
        footer.appendChild(document.createElement("td"));

        for (let j = 0; j < BOARD_SIZE; j++) {
          const td = document.createElement("td");
          td.textContent = COL_LETTERS[j];
          td.style.fontWeight = "bold";
          td.style.backgroundColor = "#f0f0f0";
          footer.appendChild(td);
        }
        table.appendChild(footer);
        boardDiv.appendChild(table);
      }

      function handleCellClick(x, y) {
        if (!field) return;

        if (gameState === 0) {
          socket.emit("place_soldaten", x, y, room);
        } else if (gameState === 1) {
          if (selectedPiece === null) {
            const cell = field[x][y];
            const isMySoldier =
              (player === 1 && cell === 1) || (player === 2 && cell === 2);

            if (isMySoldier) {
              selectedPiece = { x, y };
              drawField();
            }
          } else {
            socket.emit(
              "move_object",
              selectedPiece.x,
              selectedPiece.y,
              x,
              y,
              room,
            );
            selectedPiece = null;
            drawField();
          }
        }
      }

      socket.on("joined_room", (data) => {
        joinBtn.removeAttribute("disabled");

        infoEl.innerText = "";

        if (data.board) {
          field = data.board;
        }

        if (data.player) {
          player = data.player;
          playerColorEl.innerText =
            "You are: " + (data.player === 1 ? "White 👇🏻" : "Black 👆🏿");
        }

        if (data.capture) {
          captureCounter = data.capture;
          captureCounterEl.innerText = `Capture: ${data.capture}`;
        }

        if (data.turn) {
          turn = data.turn;
          turnEl.innerText = "Turn: " + (data.turn === 1 ? "White" : "Black");
        }

        if (data.message) {
          infoEl.innerText = data.message;
        }

        drawField();
      });

      socket.on("update_field", (newField) => {
        field = newField;
        drawField();
      });

      socket.on("info", (data) => {
        console.log(data);

        if (data.gameState) {
          gameState = data.gameState;
        }

        if (data.capture) {
          captureCounter = data.capture;
          captureCounterEl.innerText = `Capture: ${captureCounter}`;
        }

        if (data.turn) {
          turn = data.turn;
          turnEl.innerText = "Turn: " + (data.turn === 1 ? "White" : "Black");
        }

        if (data.message) {
          infoEl.innerText = data.message;
        }
      });

      socket.on("error", (err) => console.error(err));
    </script>
  </body>
</html>
